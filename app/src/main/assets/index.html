<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'"><meta name="theme-color" content="#f7f5fd"><title>星屿课表</title><link rel="stylesheet" href="style.css"></head>
<body><div id="scene" aria-hidden="true"><div id="wallpaper"></div><div class="veil"></div></div><div id="app">
<header class="app-header"><div class="brand"><span class="brand-icon">✦</span><strong>星屿课表</strong></div><div class="header-title" id="header-title" aria-hidden="true"></div><button class="icon-button header-add" data-action="add" aria-label="添加课程" title="添加课程"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button></header>
<main id="content" tabindex="-1"></main>
<nav id="navigation" aria-label="主导航"></nav><button id="today-button" class="today-fab" data-action="today" aria-label="回到今日" title="回到今日">今</button><div id="week-feedback" class="week-feedback" role="status" aria-live="polite"></div></div>
<dialog id="sheet"><div class="sheet-head"><span class="sheet-grabber" aria-hidden="true"></span><h2 id="sheet-title"></h2><button class="icon-button sheet-close" data-action="close" aria-label="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10M17 7 7 17"/></svg></button></div><div id="sheet-body"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<input id="browser-import" type="file" accept=".json,.csv,.html,.htm" hidden><input id="browser-background" type="file" accept="image/*" hidden>
<script src="version.js"></script><script src="core.js"></script><script src="app.js"></script></body></html>
